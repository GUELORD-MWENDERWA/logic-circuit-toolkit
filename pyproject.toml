[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logickit"
version = "0.1.0"
description = "Boolean algebra toolkit: expression parsing, truth tables, Quine-McCluskey minimisation and gate-level circuit simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guelord Mwenderwa" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
logickit = "logickit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
